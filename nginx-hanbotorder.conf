# HTTP to HTTPS redirect - www.hanbotorder.id.vn
server {
    if ($host = www.hanbotorder.id.vn) {
        return 301 https://$host$request_uri;
    }

    if ($host = hanbotorder.id.vn) {
        return 301 https://$host$request_uri;
    }

    listen 80;
    listen [::]:80;
    server_name hanbotorder.id.vn www.hanbotorder.id.vn;
    return 404;
}

