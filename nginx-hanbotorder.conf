# Web app - hanbotorder.id.vn
server {
    server_name hanbotorder.id.vn www.hanbotorder.id.vn;
    client_max_body_size 30M;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        
        # Cookie proxy settings for cross-subdomain authentication
        proxy_cookie_domain localhost .hanbotorder.id.vn;
        proxy_cookie_path / /;
        proxy_cookie_flags ~ secure samesite=lax;
    }

    listen [::]:443 ssl ipv6only=on;
    listen 443 ssl;
    ssl_certificate /etc/letsencrypt/live/hanbotorder.id.vn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/hanbotorder.id.vn/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

