name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: hanbotorder_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d hanbotorder_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/hanbotorder_test?schema=public
      JWT_SECRET: ci-only-secret-at-least-32-characters
      PAYMENT_GATEWAY_PROVIDER: manual_bank_transfer
      EMAIL_PROVIDER: log
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 9.15.0 }
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm prisma:generate
      - run: pnpm prisma migrate deploy --schema prisma/schema.prisma
      - run: pnpm typecheck
      - run: pnpm --filter @hanbotorder/web test
      - run: pnpm --filter @hanbotorder/admin test
      - run: pnpm --filter @hanbotorder/api test
      - run: pnpm build

  container-build:
    runs-on: ubuntu-latest
    needs: verify
    timeout-minutes: 30
    strategy:
      matrix: { app: [api, web, admin] }
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.${{ matrix.app }}
          push: false
          tags: hanbotorder-${{ matrix.app }}:${{ github.sha }}
          build-args: |
            NEXT_PUBLIC_API_URL=http://localhost:3001/api/v1
            NEXT_PUBLIC_SITE_URL=http://localhost:3000
            API_INTERNAL_URL=http://api:3001/api/v1
